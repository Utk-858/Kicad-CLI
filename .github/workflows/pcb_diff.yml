name: PCB Diff

on:
  pull_request:
    paths:
      - '**.kicad_pcb'

jobs:
  pcb-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detect changed .kicad_pcb files
        id: pcb
        run: |
          FILES=$(git diff --name-only origin/main HEAD | grep ".kicad_pcb" || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Extract PCB file versions
        if: steps.pcb.outputs.files != ''
        run: |
          mkdir -p boards
          # Save changed files (one per line)
          echo "${{ steps.pcb.outputs.files }}" | while read FILE; do
            [ -z "$FILE" ] && continue
            # Extract previous version from origin/main
            if git cat-file -e origin/main:"$FILE"; then
              git show origin/main:"$FILE" > "boards/before_$(basename $FILE)"
            else
              echo "PCB file not found in origin/main, using empty file as base."
              touch "boards/before_$(basename $FILE)"
            fi
            # Copy current version from PR
            cp "$FILE" "boards/after_$(basename $FILE)"
          done

      - name: Ensure output directory exists
        if: steps.pcb.outputs.files != ''
        run: |
          mkdir -p output

      - name: Run fluxdiff for all changed PCB files
        if: steps.pcb.outputs.files != ''
        run: |
          set -e
          PCB_FOUND=0
          echo "${{ steps.pcb.outputs.files }}" | while read FILE; do
            [ -z "$FILE" ] && continue
            PCB_FOUND=1
            BEFORE="boards/before_$(basename $FILE)"
            AFTER="boards/after_$(basename $FILE)"
            if [ -f "$BEFORE" ] && [ -f "$AFTER" ]; then
              # Output for each PCB into the output dir (may overwrite if names overlap)
              python -m fluxdiff.cli.main "$BEFORE" "$AFTER" --output output/
            fi
          done
          if [ $PCB_FOUND -eq 0 ]; then
            echo "No PCB files to compare."
          fi

      - name: Upload PCB diff as artifact
        if: steps.pcb.outputs.files != ''
        uses: actions/upload-artifact@v3
        with:
          name: pcb-diff
          path: output/

      - name: Comment summary on PR
        if: steps.pcb.outputs.files != '' && success()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ## 🧠 FluxDiff PCB Analysis

            FluxDiff detected PCB layout changes.

            Generated artifacts:

            - before.png
            - after.png
            - diff_overlay.png
            - diff_report.txt

            Download the visual diff images from the Artifacts section of this workflow run.