name: PCB Diff

on:
  pull_request:

jobs:
  pcb-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detect changed .kicad_pcb file
        id: pcb
        run: |
          FILE=$(git diff --name-only origin/main HEAD | grep ".kicad_pcb" | head -n 1)
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Extract PCB file versions
        if: steps.pcb.outputs.file != ''
        run: |
          mkdir -p boards
          # Extract previous version from origin/main
          if git cat-file -e origin/main:"${{ steps.pcb.outputs.file }}"; then
            git show origin/main:"${{ steps.pcb.outputs.file }}" > boards/before.kicad_pcb
          else
            echo "PCB file not found in origin/main, using empty file as base."
            touch boards/before.kicad_pcb
          fi
          # Copy current version from PR
          cp "${{ steps.pcb.outputs.file }}" boards/after.kicad_pcb

      - name: Run fluxdiff
        if: steps.pcb.outputs.file != ''
        run: |
          mkdir -p output
          python -m fluxdiff.cli.main boards/before.kicad_pcb boards/after.kicad_pcb --output output/

      - name: Comment PCB diff report on PR
        if: steps.pcb.outputs.file != '' && success()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: output/diff_report.txt

      - name: Upload PCB diff report as artifact
        if: steps.pcb.outputs.file != ''
        uses: actions/upload-artifact@v3
        with:
          name: pcb-diff-report
          path: output/